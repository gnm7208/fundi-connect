[project]
name = "fundi-connect"
version = "0.1.0"
description = "Verified informal-services marketplace with M-PESA escrow for Kenya and East Africa"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.13.0",
    "Flask-JWT-Extended>=4.6.0",
    "marshmallow>=3.20.0",
    "Flask-Cors>=4.0.0",
    "Flask-Limiter>=3.5.0",
    "Flask-Talisman>=1.1.0",
    "bcrypt>=4.1.0",
    "psycopg2-binary>=2.9.9",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "gunicorn>=21.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "build",
    "dist",
    "server/migrations",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["server/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
