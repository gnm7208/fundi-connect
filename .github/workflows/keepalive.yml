# Keeps the free-tier Render API from sleeping (it spins down after 15 idle
# minutes and takes ~50s to wake, which looks broken to app-store users).
# GitHub pauses scheduled workflows after 60 days without repo activity —
# any commit re-enables it. Uses ~150 workflow-minutes/month, inside the free quota.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "https://fundi-connect-api.onrender.com/api/health")
          echo "status $code"
          # 2xx/3xx/4xx all mean the instance is up; only a transport error or 5xx fails the job
          [ "$code" -ge 200 ] && [ "$code" -lt 500 ]
